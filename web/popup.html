<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>scribe · Jottings</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="popup">
<!-- The Popup a FirstMate Shortcut opens. It loads fresh each time and keeps
     nothing: the Call and its Jottings come from the Plugin Server. -->
<div id="live" class="live" role="status" hidden>
  <span class="live-dot" aria-hidden="true"></span>
  <span id="live-text">Recording</span>
  <button class="act live-stop" id="stop" type="button">Stop</button>
</div>
<main class="page">
  <div id="banner" class="banner" role="alert" hidden></div>
  <p class="empty" id="no-call" hidden>No Call is recording. Start one from scribe’s page in the browser.</p>
  <p class="empty" id="stopped" hidden>The Call is stopped. Its Minutes are on scribe’s page.</p>
  <label class="jottings-label" for="jottings" id="jottings-label" hidden>Jottings</label>
  <textarea class="jottings" id="jottings" hidden spellcheck="true"
    placeholder="Type as the call goes. A line that starts with # is a heading."></textarea>
</main>
<script src="rpc.js"></script>
<script src="jottings.js"></script>
<script src="popup.js"></script>
</body>
</html>
